name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew -q test fatJar
      - name: 자기 저장소 fixture 스캔 (PR 코멘트와 같은 출력)
        run: java -jar build/libs/jvm-risk-scanner.jar fixture >> "$GITHUB_STEP_SUMMARY"
